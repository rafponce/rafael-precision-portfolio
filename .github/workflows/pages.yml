name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Render canonical portfolio
        run: python3 scripts/build_portfolio.py
      - name: Prepare deployment URLs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/build_github_pages.py --base-path "$PAGES_BASE_PATH" --output "$RUNNER_TEMP/portfolio-pages"
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/portfolio-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
